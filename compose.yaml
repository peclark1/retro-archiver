services:
  archivebox:
    image: ${ARCHIVEBOX_IMAGE:-archivebox/archivebox:0.7.4}
    container_name: retro-archiver
    restart: unless-stopped
    ports:
      - "${ARCHIVEBOX_PORT:-8000}:8000"
    environment:
      CRAWL_MAX_URLS: ${CRAWL_MAX_URLS:-250}
      MEDIA_MAX_SIZE: ${MEDIA_MAX_SIZE:-750m}

      # Retro Archiver is local-first. Do not submit captured URLs to
      # archive.org/Wayback Machine unless explicitly opted in.
      SAVE_ARCHIVE_DOT_ORG: ${SAVE_ARCHIVE_DOT_ORG:-False}

      # Preservation classes:
      #
      # 1. Downloadable artifacts are preservation objects, not web pages.
      #    Keep headers + wget/WARC and skip page/browser-oriented extractors.
      #
      # 2. z80pack /ftp/ directory indexes are useful HTML context, but they do
      #    not need repeated browser rendering. Keep headers + wget/WARC and
      #    the local text/title extractors while skipping browser/media work.
      #
      # Keep the artifact extension list conservative and extend it as new
      # retro formats appear.
      SAVE_DENYLIST: >-
        {"(?i)\\.(zip|tgz|tar\\.gz|tar|gz|bz2|xz|7z|lha|lzh|arc|zoo|arj|img|dsk|imd|td0|hfe|bin|rom|hex|iso|pdf)(?:[?#].*)?$":["favicon","singlefile","pdf","screenshot","dom","title","readability","mercury","htmltotext","git","media","archive_org"],"(?i)^https?://(www\\.)?icl1900\\.co\\.uk/unix4fun/z80pack/ftp(?:/.*)?/$":["favicon","singlefile","pdf","screenshot","dom","git","media","archive_org"]}
    volumes:
      # Keep ArchiveBox DB/config/logs local on the SIMH host.
      - ./data:/data

      # Phase 1 default: ./archive is local.
      # Phase 2: set ARCHIVE_ROOT to the TrueNAS-backed mount path.
      - ${ARCHIVE_ROOT:-./archive}:/data/archive
